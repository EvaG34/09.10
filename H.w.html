<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>
    Радиус (r): <input id="radius" type="number"> <br />
    Высота (h): <input id="height" type="number"> <br />

    <button id="calc-btn">Рассчитать объем</button>

    <div id="result"></div>

    <script>
        let radiusInput = document.querySelector("#radius");
        let heightInput = document.querySelector("#height");
        let calcBtn = document.querySelector("#calc-btn");
        let resultDiv = document.querySelector("#result");

        calcBtn.addEventListener("click", function () {
            let r = Number(radiusInput.value);
            let h = Number(heightInput.value);

            let volume = Math.PI * Math.pow(r, 2) * h;

            resultDiv.innerText = "Объем цилиндра: " + volume;
        });
    </script>
</body>

</html>
